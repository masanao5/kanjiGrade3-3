      function parseProblemData(text) {
          return text.split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0)
              .map((line, i) => {
                  let q = '', a = '';
                  if (line.includes('\t')) {
                      const parts = line.split('\t');
                      q = parts[0].trim(); a = parts[1].trim();
                  } else if (line.includes(',')) {
                      const parts = line.split(',');
                      q = parts[0].trim(); a = parts[1].trim();
                  } else {
                      const match = line.match(/^(.+?)[\s ]+(.+)$/);
                      if (match) {
                          q = match[1].trim(); a = match[2].trim();
                      } else {
                          q = line.trim(); a = '？';
                      }
                  }
                  return { id: i + 1, q, a, w: 100, ok: false, star: false };
              });
      }

              if (activeMode === 'star') return items.filter(i => i.star);
              if (activeMode === 'ng') return items.filter(i => !i.ok);
              if (activeMode === 'ok') return items.filter(i => i.ok);
              return items;
          }, [items, activeMode]);

          // リストモーダル用のフィルタリングを安全に実行
          const filteredListItems = useMemo(() => {
              return items.filter(i => {
                  if (listFilter === 'star') return i.star;
                  if (listFilter === 'ng') return !i.ok;
                  if (listFilter === 'ok') return i.ok;
                  return true;
              });
          }, [items, listFilter]);

          useEffect(() => {
              const saved = safeStorage.getItem(PRESETS_KEY);
              if (saved) {
                  try { setPresets(JSON.parse(saved)); } catch(e) {}
              } else {
                  setPresets(DEFAULT_PRESETS);
                  safeStorage.setItem(PRESETS_KEY, JSON.stringify(DEFAULT_PRESETS));
              }
          }, []);

          useEffect(() => {
              const savedData = safeStorage.getItem(STORAGE_KEY_V2);
              let loadedItems = [...initialData];
              if (savedData) {
                  try {
                      const pd = JSON.parse(savedData);
                      loadedItems = loadedItems.map(item => {
                          const history = pd[item.q];
                          return history ? { ...item, ...history } : item;
                      });
                  } catch(e) {}
              }
              setItems(loadedItems);

              const s = safeStorage.getItem(SETTINGS_KEY);
              if (s) {
                  try {
                      const p = JSON.parse(s);
                      setSettings(prev => ({ ...prev, ...p }));
                      if (p.darkMode) document.documentElement.classList.add('dark');
                  } catch(e) {}
              }
          }, [initialData]);

          useEffect(() => {
              if (items.length > 0 && !currentItem && !isFinished) {
                 nextQuestion(items, activeMode);
              }
          }, [items]);

          useEffect(() => {
              if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                  const recognition = new SpeechRecognition();
                  recognition.lang = 'ja-JP';
                  recognition.continuous = false;
                  recognition.interimResults = true;
                  recognition.onresult = (e) => {
                      setDictationResult(Array.from(e.results).map(r => r[0].transcript).join(''));
                  };
                  recognition.onerror = (e) => {
                      if (e.error !== 'aborted') showToast('音声認識エラー: ' + e.error);
                      setIsListening(false);
                  };
                  recognition.onend = () => setIsListening(false);
                  recognitionRef.current = recognition;
              }
          }, []);

          const saveItems = (newItems) => {
              setItems(newItems);
              const dataToSave = {};
              newItems.forEach(i => { 
                  if (i.ok || i.star || i.w !== 100) dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; 
              });
              safeStorage.setItem(STORAGE_KEY_V2, JSON.stringify(dataToSave));
          };

          const nextQuestion = (currentItems, mode) => {
              let targetGroup = currentItems;
              let unmastered = [];

              if (mode === 'star') {
                  targetGroup = currentItems.filter(i => i.star);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else if (mode === 'ng') {
                  targetGroup = currentItems.filter(i => !i.ok);
                  unmastered = targetGroup.filter(i => !i.ok);
              } else if (mode === 'ok') {
                  targetGroup = currentItems.filter(i => i.ok);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else {
                  targetGroup = currentItems;
                  unmastered = targetGroup.filter(i => !i.ok);
              }

              if (unmastered.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);
              
              const totalW = unmastered.reduce((s, i) => s + i.w, 0);
              let r = Math.random() * totalW;
              let selected = null;
              for (let i of unmastered) {
                  if (r < i.w) { selected = i; break; }
                  r -= i.w;
              }
              setCurrentItem(selected);
              setIsRevealed(false);
              clearCanvas(); 
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed) return;
              setIsRevealed(true);
              const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
              if (settings.autoSpeak) speak(textToSpeak, settings.rateIndex);
          }, [currentItemDetail, isRevealed, settings]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = (settings.reverseMode ? currentItemDetail.q : currentItemDetail.a).trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer || userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
              if (settings.autoSpeak) speak(textToSpeak, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings]);

          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed) return;
              const newItems = items.map(item => {
                  if (item.q === currentItemDetail.q) {
                      if (activeMode === 'star') {
                          return { ...item, w: isOk ? 1 : item.w + 200, ok: isOk ? true : item.ok, star: isOk ? false : item.star, sessionDone: isOk };
                      } else {
                          return { ...item, w: isOk ? 1 : item.w + 200, ok: isOk, sessionDone: isOk };
                      }
                  }
                  return item;
              });
              if (isOk) updateLeaderboardStats(1);
              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, items, activeMode]);

          const toggleStar = (id) => {
              const newItems = items.map(item => item.id === id ? { ...item, star: !item.star } : item);
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) showToast(target.star ? "★ 要復習に追加" : "★ 要復習から外しました");
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(text);
              const englishPattern = /^[A-Za-z0-9\s,.:?!'"()\-]+$/;
              u.lang = englishPattern.test(text.replace(/[\s\d]/g, '')) ? 'en-US' : 'ja-JP';
              u.rate = speechRates[rateIdx]?.value || 1.0;
              window.speechSynthesis.speak(u);
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) return showToast('ブラウザが音声認識に未対応です');
              if (isListening) {
                  recognitionRef.current.stop();
                  setIsListening(false);
              } else {
                  setDictationResult('');
                  try { recognitionRef.current.start(); setIsListening(true); } 
                  catch(e) { showToast('音声認識を開始できません'); }
              }
          };

          const updateSetting = (key, value) => {
              const newSettings = { ...settings, [key]: value };
              setSettings(newSettings);
              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (key === 'darkMode') {
                  if (value) document.documentElement.classList.add('dark');
                  else document.documentElement.classList.remove('dark');
              }
          };

          const applyPreset = (preset) => {
              const newSettings = { ...settings, ...preset.settings };
              setSettings(newSettings);
              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (newSettings.darkMode) document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
              showToast(`プリセット「${preset.name}」を適用しました`);
          };

          const savePreset = () => {
              if (!presetName.trim()) return;
              const newPreset = { id: `preset_${Date.now()}`, name: presetName.trim(), settings: { ...settings } };
              const updated = [...presets, newPreset];
              setPresets(updated);
              safeStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              setPresetName('');
              setShowPresetSave(false);
              showToast(`プリセット「${newPreset.name}」を保存しました`);
          };

          const deletePreset = (id, e) => {
              e.stopPropagation();
              const updated = presets.filter(p => p.id !== id);
              setPresets(updated);
              safeStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              showToast('プリセットを削除しました');
          };

          const showToast = (msg) => {
              setToast({ message: msg, visible: true });
              setTimeout(() => setToast({ message: '', visible: false }), 2000);
          };

          const startFocusedLearning = () => {
              const newItems = items.map(i => ({ ...i, sessionDone: false }));
              setItems(newItems);
              setActiveMode(listFilter);
              setModals({ ...modals, list: false });
              nextQuestion(newItems, listFilter);
              showToast("集中学習を開始しました");
          };

          const applyCustomData = () => {
              safeStorage.setItem(CUSTOM_DATA_KEY, tempRawText);
              setRawText(tempRawText);
              safeStorage.removeItem(STORAGE_KEY_V2);
              setActiveMode('all');
              setModals(prev => ({ ...prev, edit: false }));
              showToast("データを適用しました");
          };

          const resetToDefaultData = () => {
              if (window.confirm("デフォルトの問題に戻しますか？")) {
                  safeStorage.removeItem(CUSTOM_DATA_KEY);
                  safeStorage.removeItem(STORAGE_KEY_V2);
                  setRawText(DEFAULT_EXCEL_DATA);
                  setTempRawText(DEFAULT_EXCEL_DATA);
                  setActiveMode('all');
                  setModals(prev => ({ ...prev, edit: false }));
                  showToast("デフォルトに戻しました");
              }
          };

          const resetAllData = () => {
              if (window.confirm("全学習履歴を削除して最初からやり直しますか？")) {
                  safeStorage.removeItem(STORAGE_KEY_V2);
                  const freshItems = parseProblemData(rawText);
                  setItems(freshItems);
                  setActiveMode('all');
                  setModals({ ...modals, menu: false });
                  nextQuestion(freshItems, 'all');
                  showToast("学習データをリセットしました");
              }
          };

          const getStudySeconds = () => {
              const start = safeStorage.getItem(LEADERBOARD_SESSION_START);
              if (!start) {
                  safeStorage.setItem(LEADERBOARD_SESSION_START, Date.now());
                  return 0;
              }
              return Math.floor((Date.now() - parseInt(start)) / 1000);
          };

          const getLeaderboardStats = () => {
              try { return JSON.parse(safeStorage.getItem(LEADERBOARD_STATS_KEY)) || {}; } 
              catch(e) { return {}; }
          };

          const updateLeaderboardStats = (newlyMastered) => {
              if (newlyMastered <= 0) return;
              const stats = getLeaderboardStats();
              const today = new Date().toISOString().slice(0, 10);
              
              if (stats.todayDate !== today) {
                  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                  const yStr = yesterday.toISOString().slice(0, 10);
                  stats.streak = (stats.lastDate === yStr || stats.lastDate === today) ? (stats.streak || 0) + 1 : 1;
                  stats.todayDate = today;
                  stats.todayCount = newlyMastered;
              } else {
                  stats.todayCount = (stats.todayCount || 0) + newlyMastered;
              }
              stats.totalMastered = (stats.totalMastered || 0) + newlyMastered;
              stats.lastDate = today;
              safeStorage.setItem(LEADERBOARD_STATS_KEY, JSON.stringify(stats));
          };

          const submitToLeaderboard = () => {
              if (!LEADERBOARD_URL || !settings.leaderboardName) return;
              let id = safeStorage.getItem(LEADERBOARD_USER_KEY);
              if (!id) { id = 'u_' + Date.now(); safeStorage.setItem(LEADERBOARD_USER_KEY, id); }
              const stats = getLeaderboardStats();
              fetch(LEADERBOARD_URL, {
                  method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ userId: id, userName: settings.leaderboardName, appTitle, masteredToday: stats.todayCount||0, totalMastered: stats.totalMastered||0, streak: stats.streak||0, studySeconds: getStudySeconds() })
              }).catch(()=>{});
          };

          const fetchLeaderboardInline = (type = 'total') => {
              if (!LEADERBOARD_URL) return;
              setLeaderboardLoading(true); setLeaderboardType(type);
              const params = new URLSearchParams({ mode: 'json', type, limit: 30 });
              if (appTitle) params.set('app', appTitle);
              fetch(`${LEADERBOARD_URL}?${params}`).then(r => r.json()).then(data => { setLeaderboardData(data); setLeaderboardLoading(false); }).catch(() => { setLeaderboardData({ error: '接続エラー' }); setLeaderboardLoading(false); });
          };

          // キャンバス描画ロジック
          const draw = (e) => {
              const canvas = activeCanvasRef.current;
              if (!isDrawing.current || !canvas) return;
              e.preventDefault();
              const ctx = canvas.getContext('2d');
              let clientX, clientY, pressure = 0.5;
              if (e.touches && e.touches.length > 0) {
                  clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
                  if (e.touches[0].force !== undefined) pressure = Math.max(0.1, e.touches[0].force);
              } else {
                  clientX = e.clientX; clientY = e.clientY;
                  const native = e.nativeEvent || e;
                  if (native.pressure !== undefined && native.pressure > 0) pressure = native.pressure;
              }
              const rect = canvas.getBoundingClientRect();
              const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
              const x = (clientX - rect.left) * scaleX, y = (clientY - rect.top) * scaleY;
              const now = Date.now(), dist = Math.sqrt(Math.pow(x - lastX.current, 2) + Math.pow(y - lastY.current, 2));
              let speed = dist / (now - lastTime.current || 1);
              if (speed > 5) speed = 5;
              const isPen = (e.nativeEvent || e).pointerType === 'pen' || (e.touches && e.touches.length > 0);
              let targetWidth = isPen ? 1.5 + (pressure * 8.5) : 6.8 - (speed * 1.0);
              currentStrokeWidth.current = Math.min(10.0, Math.max(1.5, currentStrokeWidth.current * 0.72 + targetWidth * 0.28));
              
              ctx.lineWidth = currentStrokeWidth.current;
              ctx.beginPath(); ctx.moveTo(lastX.current, lastY.current); ctx.lineTo(x, y); ctx.stroke();
              lastX.current = x; lastY.current = y; lastTime.current = now;
          };

          const startDrawing = (e) => {
              e.preventDefault();
              const canvas = e.target.closest('canvas');
              if (!canvas) return;
              activeCanvasRef.current = canvas; isDrawing.current = true;
              const isTouch = e.touches && e.touches.length > 0;
              const clientX = isTouch ? e.touches[0].clientX : e.clientX;
              const clientY = isTouch ? e.touches[0].clientY : e.clientY;
              const rect = canvas.getBoundingClientRect();
              lastX.current = (clientX - rect.left) * (canvas.width / rect.width);
              lastY.current = (clientY - rect.top) * (canvas.height / rect.height);
              lastTime.current = Date.now(); currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => { if(e) e.preventDefault(); isDrawing.current = false; };

          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return;
                  const rect = canvas.getBoundingClientRect();
                  if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2; canvas.height = rect.height * 2;
                  const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };
              if (settings.showCanvas && !isFinished && currentItemDetail) {
                  const timer = setTimeout(() => {
                      setupCanvas(canvasRef.current);
                      if (settings.canvasPosition === 'right') setupCanvas(canvasRightRef.current);
                  }, 100);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale]);

          useEffect(() => {
              const handleKeyDown = (e) => {
                  if (modals.menu || modals.list || modals.edit || isFinished) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                  if (!isRevealed) {
                      if (settings.enableInput && e.code === 'Enter') { e.preventDefault(); handleInputSubmit(); }
                      else if (!settings.enableInput && ['Space', 'Enter', 'ArrowUp', 'ArrowDown'].includes(e.code)) { e.preventDefault(); handleReveal(); }
                  } else {
                      if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                      else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }
                      else if (['Space', 'Enter'].includes(e.code) && settings.enableKeyboardSpeak) { e.preventDefault(); speak(settings.reverseMode ? currentItemDetail.q : currentItemDetail.a); }
                  }
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => window.removeEventListener('keydown', handleKeyDown);
          }, [modals, isFinished, isRevealed, currentItemDetail, handleReveal, handleResult, settings, handleInputSubmit]);

          useEffect(() => {
              if (settings.enableInput && !isRevealed && !isFinished && currentItemDetail && inputRef.current) {
                  const timer = setTimeout(() => { inputRef.current?.focus(); }, 200);
                  return () => clearTimeout(timer);
              }
          }, [currentItemDetail, settings.enableInput, isRevealed, isFinished]);

          useEffect(() => {
              safeStorage.setItem(LEADERBOARD_SESSION_START, Date.now());
              if (!LEADERBOARD_URL) return;
              submitToLeaderboard();
              const t = setInterval(submitToLeaderboard, 60000);
              return () => clearInterval(t);
          }, []);

          const okCount = activeItems.filter(i => i.ok).length;
          const totalCount = activeItems.length;
          const progressPercent = totalCount === 0 ? 0 : Math.floor((okCount / totalCount) * 100);

          const displayQuestion = currentItemDetail ? (settings.reverseMode ? currentItemDetail.a : currentItemDetail.q) : '';
          const displayAnswer = currentItemDetail ? (settings.reverseMode ? currentItemDetail.q : currentItemDetail.a) : '';
          const classSizeQ = fontSizesQ[settings.fontSizeQIndex]?.class || 'text-xl sm:text-2xl';
          const classSizeA = fontSizesA[settings.fontSizeAIndex]?.class || 'text-2xl sm:text-3xl font-bold';

          return (
              <div className={`min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'items-start' : 'items-center'} justify-center p-4 transition-colors duration-200`}>
                  
                  <div className={`flex ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'flex-row gap-4 items-start' : 'flex-col items-center'} w-full ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'max-w-[900px]' : 'max-w-lg'}`}>

                      <div className={`flex flex-col items-center ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'max-w-lg flex-1' : 'w-full'}`}>

                          <div className="bg-white dark:bg-slate-900 w-full p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80 transition-colors duration-200 relative" style={{ zoom: settings.displayScale }}>
                          
                          <div className="flex justify-between items-center mb-5 border-b border-slate-100 dark:border-slate-850 pb-3">
                              <h1 className="text-lg font-bold tracking-tight">{appTitleName}</h1>
                              <button onClick={() => setModals({ ...modals, menu: true })} className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"><IconSettings size={20} /></button>
                          </div>

                          <div className="mb-4">
                              <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-1.5">
                                  <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${progressPercent}%` }} />
                              </div>
                              <div className="flex justify-between text-[11px] font-bold text-slate-400">
                                  <span>{okCount} / {totalCount} 問マスター</span>
                                  {activeMode !== 'all' && <span className="bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full">{activeMode === 'star' ? '★ 要復習' : activeMode === 'ng' ? '未マスター' : 'マスター済'}</span>}
                              </div>
                          </div>

                          {!isFinished ? (
                              <div className="flex flex-col gap-4">
                                  <div className="relative min-h-[200px] flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900/30 rounded-2xl p-4 border border-slate-100 dark:border-slate-800/40 overflow-hidden shadow-inner">
                                      <button onClick={() => toggleStar(currentItemDetail?.id)} className={`absolute top-2 right-2 p-1.5 rounded-full z-20 ${currentItemDetail?.star ? 'text-amber-400' : 'text-slate-300 hover:text-amber-400'}`}>
                                          <IconStar size={22} fill={currentItemDetail?.star ? "currentColor" : "none"} />
                                      </button>

                                      {settings.showSpeakButton && isRevealed && (
                                          <button onClick={() => speak(displayAnswer)} className="absolute top-2 left-2 p-1.5 rounded-full z-20 text-blue-500 hover:bg-blue-50">
                                              <IconVolume2 size={20} />
                                          </button>
                                      )}

                                      {settings.showCanvas && (
                                          <div className="absolute inset-0 w-full h-full z-10 select-none">
                                              <canvas ref={canvasRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerLeave={stopDrawing} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full h-full cursor-crosshair" style={{ touchAction: 'none' }} />
                                              <button onClick={clearCanvas} className="absolute bottom-2 right-2 p-2 bg-white/80 text-slate-400 hover:text-blue-500 rounded-lg shadow-sm border border-slate-200/40 pointer-events-auto"><IconTrash size={15} /></button>
                                          </div>
                                      )}

                                      <div className={`${classSizeQ} leading-relaxed text-center break-words w-full px-8 mb-4 mt-2 select-none pointer-events-none z-0 text-slate-700 dark:text-slate-200`}>
                                          {displayQuestion || '---'}
                                      </div>

                                      <div className="min-h-[64px] flex items-center justify-center w-full px-2 select-none pointer-events-none z-0">
                                          {isRevealed ? <div className={`${classSizeA} font-serif text-blue-700 dark:text-blue-400 text-center animate-reveal`}>{displayAnswer}</div> : <div className="h-6 w-16 bg-slate-200/60 rounded-md animate-pulse" />}
                                      </div>
                                  </div>

                                  {settings.enableDictation && !isRevealed && (
                                      <div className="flex flex-col items-center gap-2">
                                          <button onClick={toggleDictation} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm ${isListening ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-700'}`}>
                                              <IconMic size={18} className={isListening ? 'animate-mic' : ''} /> {isListening ? '聞き取り中...' : '答えを音声で入力'}
                                          </button>
                                          {dictationResult && <div className="text-sm bg-slate-100 px-4 py-2 rounded-xl">認識結果：<span className="font-bold">{dictationResult}</span></div>}
                                      </div>
                                  )}

                                  {settings.enableInput && !isRevealed && (
                                      <div className="flex gap-2">
                                          <input ref={inputRef} type="text" value={inputValue} onChange={(e) => { setInputValue(e.target.value); setInputResult(null); }} onKeyDown={(e) => { if (e.key === 'Enter') handleInputSubmit(); }} placeholder="答えを入力..." className="flex-1 px-4 py-3 rounded-xl border border-slate-200 bg-white dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold" />
                                          <button onClick={handleInputSubmit} disabled={!inputValue.trim()} className="px-5 py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-200 text-white font-bold rounded-xl text-sm">確認</button>
                                      </div>
                                  )}

                                  {inputResult && isRevealed && (
                                      <div className={`text-center py-2 px-4 rounded-xl font-bold text-sm animate-reveal ${inputResult === 'correct' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                          {inputResult === 'correct' ? '正解！' : '不正解...'}
                                      </div>
                                  )}

                                  <div className="flex flex-col gap-3">
                                      {!isRevealed && !settings.enableInput ? (
                                          <button onClick={handleReveal} className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-[0_3px_0_#1e40af] active:translate-y-[3px] active:shadow-none flex flex-col items-center">
                                              <span className="text-base">正解を見る</span><span className="text-[10px] opacity-60">Space / Enter</span>
                                          </button>
                                      ) : (
                                          <div className="flex gap-3 animate-in fade-in">
                                              <button onClick={() => handleResult(false)} className="flex-1 py-3.5 bg-red-500 text-white font-bold rounded-xl shadow-[0_3px_0_#dc2626] active:translate-y-[3px] active:shadow-none flex flex-col items-center">
                                                  <span className="text-base">もう一度</span><span className="text-[10px] opacity-60">←</span>
                                              </button>
                                              <button onClick={() => handleResult(true)} className="flex-1 py-3.5 bg-emerald-500 text-white font-bold rounded-xl shadow-[0_3px_0_#059669] active:translate-y-[3px] active:shadow-none flex flex-col items-center">
                                                  <span className="text-base">マスター</span><span className="text-[10px] opacity-60">→</span>
                                              </button>
                                          </div>
                                      )}
                                  </div>
                              </div>
                          ) : (
                              <div className="flex flex-col items-center justify-center py-10 gap-5 text-center">
                                  <IconCheckCircle size={56} className="text-emerald-500 animate-in zoom-in" />
                                  <div><h2 className="text-xl font-bold mb-1.5">学習完了！</h2><p className="text-sm text-slate-400">対象の問題をすべてマスターしました。</p></div>
                                  {activeMode !== 'all' && <button onClick={() => { const newItems = items.map(i => ({ ...i, sessionDone: false })); setItems(newItems); setActiveMode('all'); nextQuestion(newItems, 'all'); }} className="w-full py-3.5 mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl shadow-[0_3px_0_#94a3b8] active:translate-y-[3px] active:shadow-none">すべての問題に戻る</button>}
                              </div>
                          )}
                          </div>

                      {modals.menu && (
                          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-in fade-in" onClick={(e) => e.target === e.currentTarget && setModals({...modals, menu: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-xl flex flex-col max-h-[90vh]">
                                  <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700">
                                      <div><h3 className="text-base font-bold text-slate-800 dark:text-slate-100">設定</h3></div>
                                      <button onClick={() => setModals({...modals, menu: false})} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg"><IconX size={20} /></button>
                                  </div>
                                  <div className="flex border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/20 p-1.5 gap-1">
                                      {['study', 'display', 'preset', 'data'].map(t => (
                                          <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-2 text-xs font-bold rounded-xl ${activeTab === t ? 'bg-blue-600 text-white' : 'text-slate-500 hover:bg-slate-200/50'}`}>{t === 'study' ? '学習' : t === 'display' ? '画面' : t === 'preset' ? 'プリセット' : 'データ'}</button>
                                      ))}
                                  </div>
                                  <div className="p-5 overflow-y-auto flex-1 space-y-6">
                                      {activeTab === 'study' && (
                                          <div className="space-y-4">
                                              <div className="flex items-center justify-between">
                                                  <span className="font-semibold text-sm">手書きキャンバス</span>
                                                  <input type="checkbox" checked={settings.showCanvas} onChange={(e) => updateSetting('showCanvas', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                              {settings.showCanvas && (
                                                  <div className="pl-4">
                                                      <select value={settings.canvasPosition} onChange={(e) => updateSetting('canvasPosition', e.target.value)} className="text-sm bg-slate-100 p-2 rounded-lg w-full dark:bg-slate-700">
                                                          <option value="overlay">カードのみ</option><option value="right">カード＋右パネル</option>
                                                      </select>
                                                  </div>
                                              )}
                                              <div className="flex items-center justify-between border-t pt-4 border-slate-100 dark:border-slate-700">
                                                  <span className="font-semibold text-sm">キーボード入力モード</span>
                                                  <input type="checkbox" checked={settings.enableInput} onChange={(e) => updateSetting('enableInput', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                              <div className="flex items-center justify-between border-t pt-4 border-slate-100 dark:border-slate-700">
                                                  <span className="font-semibold text-sm">出題の反転</span>
                                                  <input type="checkbox" checked={settings.reverseMode} onChange={(e) => updateSetting('reverseMode', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                              <div className="flex items-center justify-between border-t pt-4 border-slate-100 dark:border-slate-700">
                                                  <span className="font-semibold text-sm">自動読み上げ</span>
                                                  <input type="checkbox" checked={settings.autoSpeak} onChange={(e) => updateSetting('autoSpeak', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                              <div className="flex items-center justify-between">
                                                  <span className="font-semibold text-sm">個別読み上げボタン</span>
                                                  <input type="checkbox" checked={settings.showSpeakButton} onChange={(e) => updateSetting('showSpeakButton', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                              <div className="flex items-center justify-between">
                                                  <span className="font-semibold text-sm">音声認識(聞き取り)</span>
                                                  <input type="checkbox" checked={settings.enableDictation} onChange={(e) => updateSetting('enableDictation', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                          </div>
                                      )}
                                      {activeTab === 'display' && (
                                          <div className="space-y-4">
                                              <div>
                                                  <span className="font-semibold text-sm mb-2 block">表示倍率</span>
                                                  <select value={settings.displayScale} onChange={(e) => updateSetting('displayScale', parseFloat(e.target.value))} className="text-sm bg-slate-100 p-2 rounded-lg w-full dark:bg-slate-700">
                                                      <option value="1">1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option>
                                                  </select>
                                              </div>
                                              <div className="flex items-center justify-between border-t pt-4 border-slate-100 dark:border-slate-700">
                                                  <span className="font-semibold text-sm">ダークモード</span>
                                                  <input type="checkbox" checked={settings.darkMode} onChange={(e) => updateSetting('darkMode', e.target.checked)} className="w-5 h-5" />
                                              </div>
                                          </div>
                                      )}
                                      {activeTab === 'preset' && (
                                          <div className="space-y-4">
                                              {presets.map(p => (
                                                  <button key={p.id} onClick={() => applyPreset(p)} className="w-full text-left p-3 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm font-bold flex justify-between">
                                                      {p.name}
                                                      {(!['preset_kanji_normal', 'preset_kanji_write', 'preset_english_normal', 'preset_english_write', 'preset_english_type', 'preset_english_listen'].includes(p.id)) && <span onClick={(e) => deletePreset(p.id, e)} className="text-red-500">削除</span>}
                                                  </button>
                                              ))}
                                              <div className="flex gap-2 mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                                                  <input type="text" value={presetName} onChange={e => setPresetName(e.target.value)} placeholder="プリセット名" className="flex-1 p-2 border rounded-lg text-sm dark:bg-slate-700" />
                                                  <button onClick={savePreset} className="bg-blue-600 text-white px-4 rounded-lg font-bold text-sm">保存</button>
                                              </div>
                                          </div>
                                      )}
                                      {activeTab === 'data' && (
                                          <div className="space-y-4">
                                              <button onClick={() => { setModals({menu:false, list:true}); setListFilter('all'); }} className="w-full p-3 bg-slate-100 dark:bg-slate-700 rounded-lg font-bold text-sm">問題リスト表示</button>
                                              <button onClick={() => { setModals({menu:false, edit:true}); setTempRawText(rawText); }} className="w-full p-3 bg-slate-100 dark:bg-slate-700 rounded-lg font-bold text-sm">問題データの編集</button>
                                              <button onClick={resetAllData} className="w-full p-3 bg-red-100 text-red-600 rounded-lg font-bold text-sm mt-4">学習進捗をリセット</button>
                                          </div>
                                      )}
                                  </div>
                              </div>
                          </div>
                      )}

                      {modals.list && (
                          <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, list: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-2xl h-[85vh] flex flex-col rounded-3xl shadow-xl">
                                  <div className="p-4 border-b border-slate-100 flex justify-between items-center"><h3 className="font-bold">問題リスト</h3><button onClick={() => setModals({...modals, list: false, menu: true})}><IconX /></button></div>
                                  <div className="flex gap-2 p-2 overflow-x-auto bg-slate-50 dark:bg-slate-900 shrink-0">
                                      {[{id:'all',l:'すべて'},{id:'star',l:'★要復習'},{id:'ng',l:'未マスター'},{id:'ok',l:'マスター済'}].map(f => (
                                          <button key={f.id} onClick={() => setListFilter(f.id)} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${listFilter===f.id?'bg-blue-600 text-white':'bg-slate-200 dark:bg-slate-700'}`}>{f.l}</button>
                                      ))}
                                  </div>
                                  <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                      {filteredListItems.map(item => (
                                          <div key={item.id} className="flex items-center gap-4 p-3 bg-slate-50 dark:bg-slate-700 rounded-xl">
                                              <button onClick={() => toggleStar(item.id)}><IconStar size={20} className={item.star ? "text-amber-400" : "text-slate-300"} fill={item.star?"currentColor":"none"}/></button>
                                              <div><div className="font-bold text-sm">{item.q}</div><div className="text-xs text-blue-600 dark:text-blue-400 font-bold">{item.a}</div></div>
                                          </div>
                                      ))}
                                      {filteredListItems.length === 0 && <div className="text-center p-4 text-slate-400 text-sm">該当なし</div>}
                                  </div>
                                  <div className="p-4 flex gap-2">
                                      <button onClick={() => setModals({...modals, list: false, menu: true})} className="px-6 py-3 bg-slate-200 dark:bg-slate-700 font-bold rounded-xl text-sm">戻る</button>
                                      <button onClick={startFocusedLearning} disabled={filteredListItems.length===0} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm disabled:bg-slate-300">表示中の条件で学習開始</button>
                                  </div>
                              </div>
                          </div>
                      )}

                      {modals.edit && (
                          <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, edit: false})}>
                              <div className="bg-white dark:bg-slate-800 w-full max-w-xl h-[85vh] flex flex-col rounded-3xl shadow-xl">
                                  <div className="p-4 border-b border-slate-100 flex justify-between items-center"><h3 className="font-bold">問題編集</h3><button onClick={() => setModals({...modals, edit: false, menu: true})}><IconX /></button></div>
                                  <div className="flex-1 p-4 flex flex-col gap-2 min-h-0">
                                      <p className="text-xs text-slate-500">問題[スペース]答え の形式で入力</p>
                                      <textarea value={tempRawText} onChange={e => setTempRawText(e.target.value)} className="flex-1 w-full p-3 rounded-xl border bg-slate-50 dark:bg-slate-900 font-mono text-sm resize-none" />
                                  </div>
                                  <div className="p-4 flex gap-2">
                                      <button onClick={resetToDefaultData} className="px-4 py-3 bg-slate-200 dark:bg-slate-700 font-bold rounded-xl text-sm">デフォルト</button>
                                      <button onClick={() => setModals({...modals, edit:false, menu:true})} className="px-4 py-3 bg-slate-200 dark:bg-slate-700 font-bold rounded-xl text-sm">戻る</button>
                                      <button onClick={applyCustomData} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">適用</button>
                                  </div>
                              </div>
                          </div>
                      )}

                      <div className="mt-8 text-center px-4 text-xs text-slate-400">出典：新学社「漢字練習字典」</div>
                  </div>

                  {settings.showCanvas && settings.canvasPosition === 'right' && !isFinished && (
                      <div className="w-72 shrink-0 sticky top-4" style={{ zoom: settings.displayScale }}>
                          <div className="bg-white dark:bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-200/60">
                              <div className="flex items-center justify-between mb-3"><h3 className="text-sm font-bold">手書きキャンバス</h3><button onClick={() => updateSetting('canvasPosition', 'overlay')}><IconX size={14} /></button></div>
                              <div className="relative rounded-2xl overflow-hidden border bg-slate-50 dark:bg-slate-800" style={{aspectRatio: '3/4'}}>
                                  <canvas ref={canvasRightRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerLeave={stopDrawing} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full h-full cursor-crosshair" style={{ touchAction: 'none' }} />
                              </div>
                              <button onClick={clearCanvas} className="mt-3 w-full py-2 bg-slate-100 dark:bg-slate-800 font-bold text-xs rounded-xl">消去</button>
                          </div>
                      </div>
                  )}

              </div>
              <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all z-50 ${toast.visible ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>{toast.message}</div>
          </div>
          );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
