      body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }

      /* 答えが表示されるときの上質で滑らかなバウンドフェードインアニメーション */
      @keyframes revealAnswer {
          0% {
              opacity: 0;
              transform: scale(0.96) translateY(8px);
              filter: blur(4px);
          }
          60% {
              transform: scale(1.01) translateY(-1px);
              filter: blur(0px);
          }
          100% {
              opacity: 1;
              transform: scale(1) translateY(0);
              filter: blur(0px);
          }
      }
      .animate-reveal {
          animation: revealAnswer 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* 音声認識中のマイクアニメーション */
      @keyframes micPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.15); opacity: 0.7; }
      }
      .animate-mic {
          animation: micPulse 1.2s ease-in-out infinite;
      }
  </style>
</head>

      function parseProblemData(text) {
          return text.split('\n')
              .map(line => line.trim())
              .filter(line => line.length > 0)
              .map((line, i) => {
                  let q = '';
                  let a = '';
                  
                  if (line.includes('\t')) {
                      const parts = line.split('\t');
                      q = parts[0].trim();
                      a = parts[1].trim();
                  } else if (line.includes(',')) {
                      const parts = line.split(',');
                      q = parts[0].trim();
                      a = parts[1].trim();
                  } else {
                      const match = line.match(/^(.+?)[\s ]+(.+)$/);
                      if (match) {
                          q = match[1].trim();
                          a = match[2].trim();
                      } else {
                          q = line.trim();
                          a = '？';
                      }
                  }
                  return { id: i + 1, q, a, w: 100, ok: false, star: false };
              });
      }

      function App() {
          const [rawText, setRawText] = useState(() => {
              return safeStorage.getItem(CUSTOM_DATA_KEY) || DEFAULT_EXCEL_DATA;
          });

          const initialData = useMemo(() => {
              return parseProblemData(rawText);
          }, [rawText]);

          const [items, setItems] = useState([]);
          const [activeMode, setActiveMode] = useState('all');
          const [currentItem, setCurrentItem] = useState(null);
          const [isRevealed, setIsRevealed] = useState(false);
          const [isFinished, setIsFinished] = useState(false);
          const [appTitleName, setAppTitleName] = useState(document.title);

          const [settings, setSettings] = useState({ 
              darkMode: DEFAULT_DARK_MODE, 
              autoSpeak: DEFAULT_AUTO_SPEAK, 
              rateIndex: DEFAULT_SPEECH_RATE, 
              fontSizeQIndex: DEFAULT_FONT_SIZE_Q, 
              fontSizeAIndex: DEFAULT_FONT_SIZE_A, 
              reverseMode: DEFAULT_REVERSE_MODE,
              showCanvas: DEFAULT_SHOW_CANVAS,
              showSpeakButton: DEFAULT_SHOW_SPEAK_BUTTON,
              enableDictation: DEFAULT_ENABLE_DICTATION,
              enableKeyboardSpeak: DEFAULT_ENABLE_KEYBOARD_SPEAK,
              enableInput: DEFAULT_ENABLE_INPUT,
              canvasPosition: DEFAULT_CANVAS_POSITION,
              displayScale: DEFAULT_DISPLAY_SCALE,
              leaderboardName: DEFAULT_LEADERBOARD_NAME
          });

          const [presets, setPresets] = useState([]);
          const [presetName, setPresetName] = useState('');
          const [showPresetSave, setShowPresetSave] = useState(false);
          const [isListening, setIsListening] = useState(false);
          const [dictationResult, setDictationResult] = useState('');
          const recognitionRef = useRef(null);
          const [inputValue, setInputValue] = useState('');
          const [inputResult, setInputResult] = useState(null);
          const inputRef = useRef(null);

          const [modals, setModals] = useState({ menu: false, list: false, edit: false });
          const [activeTab, setActiveTab] = useState('study'); 
          const [tempRawText, setTempRawText] = useState(rawText);
          const [toast, setToast] = useState({ message: '', visible: false });
          const [listFilter, setListFilter] = useState('all');
          const [leaderboardType, setLeaderboardType] = useState('total');
          const [leaderboardData, setLeaderboardData] = useState(null);
          const [leaderboardLoading, setLeaderboardLoading] = useState(false);

          const canvasRef = useRef(null);
          const canvasRightRef = useRef(null);
          const isDrawing = useRef(false);
          const lastX = useRef(0);
          const lastY = useRef(0);
          const lastTime = useRef(0);
          const currentStrokeWidth = useRef(4.0);
          const activeCanvasRef = useRef(null);

          const currentItemDetail = useMemo(() => {
              if (!currentItem) return null;
              return items.find(i => i.q === currentItem.q) || currentItem;
          }, [items, currentItem]);

          const activeItems = useMemo(() => {
              if (activeMode === 'star') return items.filter(i => i.star);
              if (activeMode === 'ng') return items.filter(i => !i.ok);
              if (activeMode === 'ok') return items.filter(i => i.ok);
              return items;
          }, [items, activeMode]);

          useEffect(() => {
              const saved = safeStorage.getItem(PRESETS_KEY);
              if (saved) {
                  try { setPresets(JSON.parse(saved)); } catch(e) {}
              } else {
                  setPresets(DEFAULT_PRESETS);
                  safeStorage.setItem(PRESETS_KEY, JSON.stringify(DEFAULT_PRESETS));
              }
          }, []);

          useEffect(() => {
              const savedData = safeStorage.getItem(STORAGE_KEY_V2);
              let loadedItems = [...initialData];
              if (savedData) {
                  try {
                      const pd = JSON.parse(savedData);
                      loadedItems = loadedItems.map(item => {
                          const history = pd[item.q];
                          return history ? { ...item, ...history } : item;
                      });
                  } catch(e) {}
              }
              setItems(loadedItems);

              const s = safeStorage.getItem(SETTINGS_KEY);
              if (s) {
                  try {
                      const p = JSON.parse(s);
                      setSettings(prev => ({ ...prev, ...p }));
                      if (p.darkMode) document.documentElement.classList.add('dark');
                  } catch(e) {}
              }
          }, [initialData]);

          useEffect(() => {
              if (items.length > 0 && !currentItem && !isFinished) {
                 nextQuestion(items, activeMode);
              }
          }, [items]);

          useEffect(() => {
              if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                  const recognition = new SpeechRecognition();
                  recognition.lang = 'ja-JP';
                  recognition.continuous = false;
                  recognition.interimResults = true;
                  
                  recognition.onresult = (event) => {
                      const transcript = Array.from(event.results)
                          .map(r => r[0].transcript)
                          .join('');
                      setDictationResult(transcript);
                  };
                  recognition.onerror = (event) => {
                      if (event.error !== 'aborted') showToast('音声認識エラー: ' + event.error);
                      setIsListening(false);
                  };
                  recognition.onend = () => { setIsListening(false); };
                  recognitionRef.current = recognition;
              }
          }, []);

          const saveItems = (newItems) => {
              setItems(newItems);
              const dataToSave = {};
              newItems.forEach(i => { 
                  if (i.ok || i.star || i.w !== 100) {
                      dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; 
                  }
              });
              safeStorage.setItem(STORAGE_KEY_V2, JSON.stringify(dataToSave));
          };

          const nextQuestion = (currentItems, mode) => {
              let targetGroup = currentItems;
              let unmastered = [];

              if (mode === 'star') {
                  targetGroup = currentItems.filter(i => i.star);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else if (mode === 'ng') {
                  targetGroup = currentItems.filter(i => !i.ok);
                  unmastered = targetGroup.filter(i => !i.ok);
              } else if (mode === 'ok') {
                  targetGroup = currentItems.filter(i => i.ok);
                  unmastered = targetGroup.filter(i => !i.sessionDone);
              } else {
                  targetGroup = currentItems;
                  unmastered = targetGroup.filter(i => !i.ok);
              }

              if (unmastered.length === 0) {
                  setIsFinished(true);
                  setCurrentItem(null);
                  return;
              }

              setIsFinished(false);
              setDictationResult('');
              setInputValue('');
              setInputResult(null);
              
              const totalW = unmastered.reduce((s, i) => s + i.w, 0);
              let r = Math.random() * totalW;
              let selected = null;
              for (let i of unmastered) {
                  if (r < i.w) { selected = i; break; }
                  r -= i.w;
              }
              setCurrentItem(selected);
              setIsRevealed(false);
              clearCanvas(); 
          };

          const clearCanvas = () => {
              [canvasRef.current, canvasRightRef.current].forEach(c => {
                  if (!c) return;
                  const ctx = c.getContext('2d');
                  ctx.clearRect(0, 0, c.width, c.height);
              });
          };

          const handleReveal = useCallback(() => {
              if (!currentItemDetail || isRevealed) return;
              setIsRevealed(true);
              const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
              if (settings.autoSpeak) speak(textToSpeak, settings.rateIndex);
          }, [currentItemDetail, isRevealed, settings]);

          const handleInputSubmit = useCallback(() => {
              if (!currentItemDetail || isRevealed || !inputValue.trim()) return;
              setIsRevealed(true);
              const correctAnswer = (settings.reverseMode ? currentItemDetail.q : currentItemDetail.a).trim();
              const userAnswer = inputValue.trim();
              const isCorrect = userAnswer === correctAnswer || userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
              setInputResult(isCorrect ? 'correct' : 'incorrect');
              const textToSpeak = settings.reverseMode ? currentItemDetail.q : currentItemDetail.a;
              if (settings.autoSpeak) speak(textToSpeak, settings.rateIndex);
          }, [currentItemDetail, isRevealed, inputValue, settings]);

          const handleResult = useCallback((isOk) => {
              if (!currentItemDetail || !isRevealed) return;
              const newItems = items.map(item => {
                  if (item.q === currentItemDetail.q) {
                      if (activeMode === 'star') {
                          return { ...item, w: isOk ? 1 : item.w + 200, ok: isOk ? true : item.ok, star: isOk ? false : item.star, sessionDone: isOk };
                      } else {
                          return { ...item, w: isOk ? 1 : item.w + 200, ok: isOk, sessionDone: isOk };
                      }
                  }
                  return item;
              });
              if (isOk) updateLeaderboardStats(1);
              saveItems(newItems);
              nextQuestion(newItems, activeMode);
          }, [currentItemDetail, isRevealed, items, activeMode]);

          const toggleStar = (id) => {
              const newItems = items.map(item => item.id === id ? { ...item, star: !item.star } : item);
              saveItems(newItems);
              const target = newItems.find(i => i.id === id);
              if (target) showToast(target.star ? "★ 要復習に追加" : "★ 要復習から外しました");
          };

          const speak = (text, rateIdx = settings.rateIndex) => {
              if (!text || !('speechSynthesis' in window)) return;
              window.speechSynthesis.cancel();
              const u = new SpeechSynthesisUtterance(text);
              const englishPattern = /^[A-Za-z0-9\s,.:?!'"()\-]+$/;
              u.lang = englishPattern.test(text.replace(/[\s\d]/g, '')) ? 'en-US' : 'ja-JP';
              u.rate = speechRates[rateIdx]?.value || 1.0;
              window.speechSynthesis.speak(u);
          };

          const toggleDictation = () => {
              if (!recognitionRef.current) {
                  showToast('お使いのブラウザは音声認識に対応していません');
                  return;
              }
              if (isListening) {
                  recognitionRef.current.stop();
                  setIsListening(false);
              } else {
                  setDictationResult('');
                  try {
                      recognitionRef.current.start();
                      setIsListening(true);
                  } catch(e) { showToast('音声認識を開始できません'); }
              }
          };

          const updateSetting = (key, value) => {
              const newSettings = { ...settings, [key]: value };
              setSettings(newSettings);
              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (key === 'darkMode') {
                  if (value) document.documentElement.classList.add('dark');
                  else document.documentElement.classList.remove('dark');
              }
          };

          const applyPreset = (preset) => {
              const newSettings = { ...settings, ...preset.settings };
              setSettings(newSettings);
              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(newSettings));
              if (newSettings.darkMode) document.documentElement.classList.add('dark');
              else document.documentElement.classList.remove('dark');
              showToast(`プリセット「${preset.name}」を適用しました`);
          };

          const savePreset = () => {
              if (!presetName.trim()) return;
              const newPreset = { id: `preset_${Date.now()}`, name: presetName.trim(), settings: { ...settings } };
              const updated = [...presets, newPreset];
              setPresets(updated);
              safeStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              setPresetName('');
              setShowPresetSave(false);
              showToast(`プリセット「${newPreset.name}」を保存しました`);
          };

          const deletePreset = (id, e) => {
              e.stopPropagation();
              const updated = presets.filter(p => p.id !== id);
              setPresets(updated);
              safeStorage.setItem(PRESETS_KEY, JSON.stringify(updated));
              showToast('プリセットを削除しました');
          };

          const showToast = (msg) => {
              setToast({ message: msg, visible: true });
              setTimeout(() => setToast({ message: '', visible: false }), 2000);
          };

          const startFocusedLearning = () => {
              const newItems = items.map(i => ({ ...i, sessionDone: false }));
              setItems(newItems);
              setActiveMode(listFilter);
              setModals({ ...modals, list: false });
              nextQuestion(newItems, listFilter);
              showToast("集中学習モードを開始しました");
          };

          const applyCustomData = () => {
              safeStorage.setItem(CUSTOM_DATA_KEY, tempRawText);
              setRawText(tempRawText);
              safeStorage.removeItem(STORAGE_KEY_V2);
              setActiveMode('all');
              setModals(prev => ({ ...prev, edit: false }));
              showToast("新しい問題データを適用しました");
          };

          const resetToDefaultData = () => {
              if (window.confirm("デフォルトの漢字テスト問題に戻します。よろしいですか？")) {
                  safeStorage.removeItem(CUSTOM_DATA_KEY);
                  safeStorage.removeItem(STORAGE_KEY_V2);
                  setRawText(DEFAULT_EXCEL_DATA);
                  setTempRawText(DEFAULT_EXCEL_DATA);
                  setActiveMode('all');
                  setModals(prev => ({ ...prev, edit: false }));
                  showToast("デフォルトに戻しました");
              }
          };

          const resetAllData = () => {
              if (window.confirm("全学習履歴を削除して最初からやり直します。よろしいですか？")) {
                  safeStorage.removeItem(STORAGE_KEY_V2);
                  const freshItems = parseProblemData(rawText);
                  setItems(freshItems);
                  setActiveMode('all');
                  setModals({ ...modals, menu: false });
                  nextQuestion(freshItems, 'all');
                  showToast("学習データをリセットしました");
              }
          };

          const downloadFile = (filename, content, mimeType) => {
              const blob = new Blob([content], { type: mimeType });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url; a.download = filename;
              document.body.appendChild(a); a.click();
              document.body.removeChild(a); URL.revokeObjectURL(url);
          };

          const exportJSON = () => {
              const data = {
                  version: 1, exportedAt: new Date().toISOString(), appTitle, settings, presets,
                  progress: Object.fromEntries(items.filter(i => i.ok || i.star || i.w !== 100).map(i => [i.q, { w: i.w, ok: i.ok, star: i.star }])),
                  customData: rawText
              };
              downloadFile(`${appTitle}_backup.json`, JSON.stringify(data, null, 2), 'application/json');
              showToast('設定とデータをエクスポートしました');
          };

          const importJSON = () => {
              const input = document.createElement('input');
              input.type = 'file'; input.accept = '.json';
              input.onchange = (e) => {
                  const file = e.target.files[0]; if (!file) return;
                  const reader = new FileReader();
                  reader.onload = (ev) => {
                      try {
                          const data = JSON.parse(ev.target.result);
                          if (!window.confirm("バックアップを読み込みます。よろしいですか？")) return;
                          if (data.settings) {
                              setSettings(data.settings);
                              safeStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings));
                              if (data.settings.darkMode) document.documentElement.classList.add('dark');
                              else document.documentElement.classList.remove('dark');
                          }
                          if (data.presets) { setPresets(data.presets); safeStorage.setItem(PRESETS_KEY, JSON.stringify(data.presets)); }
                          if (data.customData !== undefined) {
                              setRawText(data.customData); safeStorage.setItem(CUSTOM_DATA_KEY, data.customData); safeStorage.removeItem(STORAGE_KEY_V2);
                              const finalItems = parseProblemData(data.customData);
                              if (data.progress) {
                                  const merged = finalItems.map(item => ({ ...item, ...(data.progress[item.q] || {}) }));
                                  setItems(merged); saveItemsRaw(merged);
                              } else { setItems(finalItems); saveItemsRaw(finalItems); }
                              setActiveMode('all');
                          }
                          showToast('バックアップを読み込みました');
                      } catch(err) { showToast('JSONの解析に失敗しました'); }
                  };
                  reader.readAsText(file);
              };
              input.click();
          };

          const saveItemsRaw = (newItems) => {
              const dataToSave = {};
              newItems.forEach(i => { if (i.ok || i.star || i.w !== 100) dataToSave[i.q] = { w: i.w, ok: i.ok, star: i.star }; });
              safeStorage.setItem(STORAGE_KEY_V2, JSON.stringify(dataToSave));
          };

          const getUserName = () => settings.leaderboardName || '';
          const getUserId = () => {
              let id = safeStorage.getItem(LEADERBOARD_USER_KEY);
              if (!id) { id = 'u_' + Date.now().toString(36); safeStorage.setItem(LEADERBOARD_USER_KEY, id); }
              return id;
          };
          const getLeaderboardStats = () => {
              try { return JSON.parse(safeStorage.getItem(LEADERBOARD_STATS_KEY)) || { todayDate: '', todayCount: 0, totalMastered: 0, streak: 0, lastDate: '' }; } catch(e) { return { todayDate: '', todayCount: 0, totalMastered: 0, streak: 0, lastDate: '' }; }
          };
          const saveLeaderboardStats = (stats) => { safeStorage.setItem(LEADERBOARD_STATS_KEY, JSON.stringify(stats)); };
          const updateLeaderboardStats = (newlyMastered) => {
              if (newlyMastered <= 0) return; const stats = getLeaderboardStats(); const today = new Date().toISOString().slice(0, 10);
              if (stats.todayDate !== today) { stats.todayDate = today; stats.todayCount = newlyMastered; } else { stats.todayCount += newlyMastered; }
              stats.totalMastered = (stats.totalMastered || 0) + newlyMastered; stats.lastDate = today; saveLeaderboardStats(stats);
          };
          const getStudySeconds = () => {
              const start = safeStorage.getItem(LEADERBOARD_SESSION_START);
              if (!start) { safeStorage.setItem(LEADERBOARD_SESSION_START, Date.now()); return 0; }
              return Math.floor((Date.now() - parseInt(start)) / 1000);
          };
          const submitToLeaderboard = () => {
              if (!LEADERBOARD_URL) return; const name = getUserName(); if (!name) return; const stats = getLeaderboardStats();
              const payload = { userId: getUserId(), userName: name, appTitle, masteredToday: stats.todayCount || 0, totalMastered: stats.totalMastered || 0, streak: stats.streak || 0, studySeconds: getStudySeconds() };
              try { fetch(LEADERBOARD_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); } catch(e) {}
          };
          const openLeaderboard = () => { if (LEADERBOARD_URL) { window.open(LEADERBOARD_URL, '_blank'); } else { showToast('リーダーボードURLが未設定です'); } };
          const fetchLeaderboardInline = (type = 'total') => {
              if (!LEADERBOARD_URL) return; setLeaderboardLoading(true); setLeaderboardType(type);
              const params = new URLSearchParams({ mode: 'json', type: type, limit: 30 }); if (appTitle) params.set('app', appTitle);
              fetch(`${LEADERBOARD_URL}?${params}`).then(r => r.json()).then(data => { setLeaderboardData(data); setLeaderboardLoading(false); }).catch(() => { setLeaderboardData({ error: '接続できませんでした' }); setLeaderboardLoading(false); });
          };

          const draw = (e) => {
              const canvas = activeCanvasRef.current; if (!isDrawing.current || !canvas) return; e.preventDefault(); const ctx = canvas.getContext('2d');
              let clientX, clientY, pressure = 0.5;
              if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } else { clientX = e.clientX; clientY = e.clientY; }
              const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
              const x = (clientX - rect.left) * scaleX; const y = (clientY - rect.top) * scaleY;
              ctx.lineWidth = currentStrokeWidth.current; ctx.beginPath(); ctx.moveTo(lastX.current, lastY.current); ctx.lineTo(x, y); ctx.stroke();
              lastX.current = x; lastY.current = y; lastTime.current = Date.now();
          };

          const startDrawing = (e) => {
              e.preventDefault(); const canvas = e.target.closest('canvas'); if (!canvas) return;
              activeCanvasRef.current = canvas; isDrawing.current = true;
              let clientX, clientY; if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } else { clientX = e.clientX; clientY = e.clientY; }
              const rect = canvas.getBoundingClientRect();
              lastX.current = (clientX - rect.left) * (canvas.width / rect.width);
              lastY.current = (clientY - rect.top) * (canvas.height / rect.height);
              lastTime.current = Date.now(); currentStrokeWidth.current = 4.0;
          };

          const stopDrawing = (e) => { if (e) e.preventDefault(); isDrawing.current = false; };

          useEffect(() => {
              const setupCanvas = (canvas) => {
                  if (!canvas) return; const rect = canvas.getBoundingClientRect(); if (rect.width === 0 || rect.height === 0) return;
                  canvas.width = rect.width * 2; canvas.height = rect.height * 2; const ctx = canvas.getContext('2d');
                  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                  ctx.strokeStyle = document.documentElement.classList.contains('dark') ? '#60a5fa' : '#2563eb';
              };
              if (settings.showCanvas && !isFinished && currentItemDetail) {
                  const timer = setTimeout(() => { setupCanvas(canvasRef.current); if (settings.canvasPosition === 'right') setupCanvas(canvasRightRef.current); }, 100);
                  return () => clearTimeout(timer);
              }
          }, [settings.showCanvas, currentItemDetail, isFinished, settings.darkMode, settings.canvasPosition, settings.displayScale]);

          useEffect(() => {
              const handleKeyDown = (e) => {
                  if (modals.menu || modals.list || modals.edit || isFinished) return;
                  if (e.code === 'KeyS') { e.preventDefault(); if(currentItemDetail) toggleStar(currentItemDetail.id); return; }
                  if (!isRevealed) {
                      if (settings.enableInput) { if (e.code === 'Enter') { e.preventDefault(); handleInputSubmit(); } }
                      else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleReveal(); }
                  } else {
                      if (e.code === 'ArrowLeft') { e.preventDefault(); handleResult(false); }
                      else if (e.code === 'ArrowRight') { e.preventDefault(); handleResult(true); }
                  }
              };
              window.addEventListener('keydown', handleKeyDown);
              return () => window.removeEventListener('keydown', handleKeyDown);
          }, [modals, isFinished, isRevealed, currentItemDetail, handleReveal, handleResult, settings, handleInputSubmit]);

          useEffect(() => {
              if (settings.enableInput && !isRevealed && !isFinished && currentItemDetail && inputRef.current) {
                  const timer = setTimeout(() => { inputRef.current?.focus(); }, 200); return () => clearTimeout(timer);
              }
          }, [currentItemDetail, settings.enableInput, isRevealed, isFinished]);

          useEffect(() => {
              if (!LEADERBOARD_URL || !getUserName()) return; submitToLeaderboard();
              const timer = setInterval(submitToLeaderboard, 60000); return () => clearInterval(timer);
          }, []);

          useEffect(() => { safeStorage.setItem(LEADERBOARD_SESSION_START, Date.now()); }, []);

          const okCount = activeItems.filter(i => i.ok).length;
          const totalCount = activeItems.length;
          const progressPercent = totalCount === 0 ? 0 : Math.floor((okCount / totalCount) * 100);
          const getModeLabel = () => { if (activeMode === 'star') return '★ 要復習'; if (activeMode === 'ng') return '未マスター'; if (activeMode === 'ok') return 'マスター済'; return ''; };
          const displayQuestion = useMemo(() => { if (!currentItemDetail) return ''; return settings.reverseMode ? currentItemDetail.a : currentItemDetail.q; }, [currentItemDetail, settings.reverseMode]);
          const displayAnswer = useMemo(() => { if (!currentItemDetail) return ''; return settings.reverseMode ? currentItemDetail.q : currentItemDetail.a; }, [currentItemDetail, settings.reverseMode]);
          const classSizeQ = fontSizesQ[settings.fontSizeQIndex]?.class || 'text-xl sm:text-2xl';
          const classSizeA = fontSizesA[settings.fontSizeAIndex]?.class || 'text-2xl sm:text-3xl font-bold';

          return (
              <div className={`min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'items-start' : 'items-center'} justify-center p-4 transition-colors duration-200`}>
                  <div className={`flex ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'flex-row gap-4 items-start' : 'flex-col items-center'} w-full ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'max-w-[900px]' : 'max-w-lg'}`}>
                      <div className={`flex flex-col items-center ${settings.showCanvas && settings.canvasPosition === 'right' && !isFinished ? 'max-w-lg flex-1' : 'w-full'}`}>
                          
                          {/* メインカード本体 */}
                          <div className="bg-white dark:bg-slate-900 w-full p-6 sm:p-8 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80 transition-colors duration-200 relative" style={{ zoom: settings.displayScale }}>
                              <div className="flex justify-between items-center mb-5 border-b border-slate-100 dark:border-slate-850 pb-3">
                                  <h1 className="text-lg font-bold tracking-tight text-slate-800 dark:text-slate-100">{appTitleName}</h1>
                                  <button onClick={() => setModals({ ...modals, menu: true })} className="p-2 rounded-xl text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"><IconSettings size={20} /></button>
                              </div>

                              <div className="mb-4">
                                  <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-1.5">
                                      <div className="h-full bg-blue-500 dark:bg-blue-600 transition-all duration-300 ease-out" style={{ width: `${progressPercent}%` }} />
                                  </div>
                                  <div className="flex justify-between text-[11px] font-bold text-slate-400 dark:text-slate-500">
                                      <span>{okCount} / {totalCount} 問マスター</span>
                                      {activeMode !== 'all' && <span className="bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded-full font-bold text-[10px]">{getModeLabel()}</span>}
                                  </div>
                              </div>

                              {!isFinished ? (
                                  <div className="flex flex-col gap-4">
                                      <div className="relative min-h-[200px] flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900/30 rounded-2xl p-4 border border-slate-100 dark:border-slate-800/40 overflow-hidden shadow-inner">
                                          <button onClick={() => toggleStar(currentItemDetail?.id)} className={`absolute top-2 right-2 p-1.5 rounded-full transition-transform active:scale-90 z-20 ${currentItemDetail?.star ? 'text-amber-400' : 'text-slate-300 dark:text-slate-700 hover:text-amber-400'}`}><IconStar size={22} fill={currentItemDetail?.star ? "currentColor" : "none"} /></button>
                                          {settings.showSpeakButton && isRevealed && (
                                              <button onClick={() => speak(settings.reverseMode ? currentItemDetail.q : currentItemDetail.a)} className="absolute top-2 left-2 p-1.5 rounded-full transition-all active:scale-90 z-20 text-blue-500 hover:text-blue-600 hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-blue-950/30"><IconVolume2 size={20} /></button>
                                          )}

                                          {settings.showCanvas && (
                                              <div className="absolute inset-0 w-full h-full z-10 select-none">
                                                  <canvas ref={canvasRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerLeave={stopDrawing} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full h-full cursor-crosshair" style={{ touchAction: 'none' }} />
                                                  <button onClick={clearCanvas} className="absolute bottom-2 right-2 p-2 bg-white/80 dark:bg-slate-800/80 text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 rounded-lg shadow-sm border border-slate-200/40 dark:border-slate-700/60 pointer-events-auto"><IconTrash size={15} /></button>
                                              </div>
                                          )}

                                          <div className={`${classSizeQ} leading-relaxed text-center break-words w-full px-8 mb-4 mt-2 select-none pointer-events-none z-0 text-slate-700 dark:text-slate-200`}>
                                              {displayQuestion || '---'}
                                          </div>

                                          <div className="min-h-[64px] flex items-center justify-center w-full px-2 select-none pointer-events-none z-0">
                                              {isRevealed ? <div className={`${classSizeA} font-serif text-blue-700 dark:text-blue-400 text-center animate-reveal`}>{displayAnswer}</div> : <div className="h-6 w-16 bg-slate-200/60 dark:bg-slate-800/60 rounded-md animate-pulse" />}
                                          </div>
                                      </div>

                                      {settings.enableDictation && !isRevealed && (
                                          <div className="flex flex-col items-center gap-2">
                                              <button onClick={toggleDictation} className={`flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${isListening ? 'bg-red-50 text-red-600 dark:bg-red-950/30' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}`}><IconMic size={18} className={isListening ? 'animate-mic' : ''} />{isListening ? '聞き取り中...' : '答えを音声で入力'}</button>
                                              {dictationResult && <div className="text-sm text-slate-600 bg-slate-100 px-4 py-2 rounded-xl">認識結果：<span className="font-bold">{dictationResult}</span></div>}
                                          </div>
                                      )}

                                      {settings.enableInput && !isRevealed && (
                                          <div className="flex gap-2">
                                              <input ref={inputRef} type="text" value={inputValue} onChange={(e) => { setInputValue(e.target.value); setInputResult(null); }} placeholder="答えを入力..." className="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold" />
                                              <button onClick={handleInputSubmit} disabled={!inputValue.trim()} className="px-5 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm">確認</button>
                                          </div>
                                      )}

                                      {inputResult && isRevealed && (
                                          <div className={`text-center py-2 px-4 rounded-xl font-bold text-sm ${inputResult === 'correct' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>{inputResult === 'correct' ? '正解！' : '不正解...'}</div>
                                      )}

                                      <div className="flex flex-col gap-3">
                                          {!isRevealed && !settings.enableInput ? (
                                              <button onClick={handleReveal} className="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow-[0_3px_0_#1e40af] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center"><span className="text-base tracking-wide">正解を見る</span><span className="text-[10px] font-normal opacity-60 mt-0.5">Space / Enter</span></button>
                                          ) : (
                                              <div className="flex gap-3">
                                                  <button onClick={() => handleResult(false)} className="flex-1 py-3.5 bg-red-500 text-white font-bold rounded-xl shadow-[0_3px_0_#dc2626] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center"><span className="text-base">もう一度</span><span className="text-[10px] font-normal opacity-60 mt-0.5">←</span></button>
                                                  <button onClick={() => handleResult(true)} className="flex-1 py-3.5 bg-emerald-500 text-white font-bold rounded-xl shadow-[0_3px_0_#059669] active:translate-y-[3px] active:shadow-none transition-all flex flex-col items-center justify-center"><span className="text-base">マスター</span><span className="text-[10px] font-normal opacity-60 mt-0.5">→</span></button>
                                              </div>
                                          )}
                                      </div>
                                  </div>
                              ) : (
                                  <div className="flex flex-col items-center justify-center py-10 gap-5 text-center">
                                      <IconCheckCircle size={56} className="text-emerald-500" />
                                      <div><h2 className="text-xl font-bold mb-1.5">すべての学習が完了しました！</h2></div>
                                      {activeMode !== 'all' && <button onClick={() => { const newItems = items.map(i => ({ ...i, sessionDone: false })); setItems(newItems); setActiveMode('all'); nextQuestion(newItems, 'all'); }} className="w-full py-3.5 bg-slate-100 text-slate-700 font-bold rounded-xl shadow-[0_3px_0_#94a3b8]">すべての問題に戻る</button>}
                                  </div>
                              )}
                          </div>

                          <div className="mt-8 text-center px-4"><p className="text-xs text-slate-400">出典：新学社「漢字練習字典」</p></div>
                      </div>

                      {/* 右側キャンバスパネル */}
                      {settings.showCanvas && settings.canvasPosition === 'right' && !isFinished && (
                          <div className="w-72 shrink-0 sticky top-4" style={{ zoom: settings.displayScale }}>
                              <div className="bg-white dark:bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-200/60 dark:border-slate-800/80">
                                  <div className="flex items-center justify-between mb-3">
                                      <h3 className="text-sm font-bold text-slate-500">手書きキャンバス</h3>
                                      <button onClick={() => updateSetting('canvasPosition', 'overlay')} className="p-1 text-slate-400 hover:text-blue-500"><IconX size={14} /></button>
                                  </div>
                                  <div className="relative rounded-2xl overflow-hidden border border-slate-100 dark:border-slate-700 bg-slate-50" style={{aspectRatio: '3/4'}}>
                                      <canvas ref={canvasRightRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerLeave={stopDrawing} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} className="w-full h-full cursor-crosshair" style={{ touchAction: 'none' }} />
                                  </div>
                                  <button onClick={clearCanvas} className="mt-3 w-full py-2 flex items-center justify-center gap-2 bg-slate-100 text-slate-500 rounded-xl text-xs font-bold"><IconTrash size={14} /> 消去</button>
                              </div>
                          </div>
                      )}
                  </div>

                  {/* 各種モーダル（省略化を避けるため構造維持） */}
                  {modals.menu && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, menu: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
                              <div className="flex justify-between items-center p-5 border-b border-slate-100 dark:border-slate-700">
                                  <span className="font-bold">オプション設定</span>
                                  <button onClick={() => setModals({...modals, menu: false})}><IconX size={20} /></button>
                              </div>
                              <div className="p-5 overflow-y-auto space-y-4">
                                  <button onClick={() => { setModals({menu: false, edit: true}); setTempRawText(rawText); }} className="w-full py-3 bg-blue-50 text-blue-700 font-bold rounded-xl border border-blue-200">問題のデータ編集（Excel貼り付け）</button>
                                  <button onClick={() => { setModals({menu: false, list: true}); setListFilter('all'); }} className="w-full py-3 bg-slate-50 text-slate-700 font-bold rounded-xl border border-slate-200">問題リスト一覧を表示</button>
                                  <button onClick={resetAllData} className="w-full py-3 text-rose-500 font-bold rounded-xl bg-rose-50">学習進捗をすべてリセット</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {modals.list && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, list: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-2xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden">
                              <div className="flex justify-between items-center p-5 border-b"><h3 className="font-bold">問題リスト</h3><button onClick={() => setModals({...modals, list: false, menu: true})}><IconX size={24} /></button></div>
                              <div className="flex-1 overflow-y-auto p-4 space-y-2">
                                  {items.map(item => (<div key={item.id} className="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl flex justify-between"><span>{item.q}</span><span className="font-bold text-blue-600">{item.a}</span></div>))}
                              </div>
                          </div>
                      </div>
                  )}

                  {modals.edit && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={(e) => e.target === e.currentTarget && setModals({...modals, edit: false})}>
                          <div className="bg-white dark:bg-slate-800 w-full max-w-xl h-[85vh] flex flex-col rounded-3xl shadow-xl overflow-hidden">
                              <div className="flex justify-between items-center p-5 border-b"><h3 className="font-bold">問題データの編集</h3><button onClick={() => setModals({...modals, edit: false, menu: true})}><IconX size={24} /></button></div>
                              <div className="flex-1 p-4 flex flex-col gap-2">
                                  <textarea value={tempRawText} onChange={(e) => setTempRawText(e.target.value)} className="flex-1 w-full p-4 rounded-xl border bg-slate-50 font-mono text-sm resize-none" placeholder={"問題 [タブ] 答え\nの形式で入力してください"} />
                              </div>
                              <div className="p-4 border-t bg-slate-50 flex gap-2">
                                  <button onClick={resetToDefaultData} className="px-4 py-2 bg-slate-200 font-bold rounded-xl text-sm">デフォルトに戻す</button>
                                  <button onClick={applyCustomData} className="flex-1 py-2 bg-blue-600 text-white font-bold rounded-xl text-sm">適用して学習を開始</button>
                              </div>
                          </div>
                      </div>
                  )}

                  <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 z-50 ${toast.visible ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>{toast.message}</div>
              </div>
          );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
  </script>
</body>
</html>
